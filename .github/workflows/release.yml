name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild (e.g., v1.2.3 or v1.2.3-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Share the same group across tag pushes and manual rebuilds of that tag.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          # SemVer core + optional prerelease; build metadata (+...) is not
          # supported because Docker image tags cannot contain '+'.
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          pattern="^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$tag" =~ $pattern ]] || (( ${#tag} > 129 )); then
            echo '::error::Expected vX.Y.Z or vX.Y.Z-prerelease (image tag at most 128 characters).'
            exit 1
          fi
          printf 'name=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout version tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          # Require the exact tag, including when a same-named branch exists.
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$commit" != "$tag_commit" ]]; then
            echo '::error::Checked-out commit does not match the requested tag.'
            exit 1
          fi

          version=${RELEASE_TAG#v}
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'tags<<IMAGE_TAGS'
            printf '%s:%s\n' "$image" "$version"
            printf '%s:sha-%s\n' "$image" "$commit"
            if [[ "$GITHUB_EVENT_NAME" == 'push' && "$version" != *-* ]]; then
              printf '%s:latest\n' "$image"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64
