# Overlay on values-minimal.yaml. Replace domains, class, CIDR and Secret names.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: transit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: transit-tls
      hosts: [transit.example.com]
extraEnv:
  - name: SECURITY_TRUST_FORWARDED_IP_FOR_API_KEY_ACL
    value: "false"
  - name: SERVER_TRUSTED_PROXIES
    value: "10.42.0.0/24" # Replace with the actual direct ingress proxy CIDR/IP.
