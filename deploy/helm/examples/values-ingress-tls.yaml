image:
  tag: "0.2.1"
externalDatabase:
  host: postgres.example.internal
  existingSecret: transit-postgres
app:
  publicBaseURL: https://transit.example.com
  stationHomeURL: https://station.example.com
  stationPriceURL: https://station.example.com/prices
  stationMonitorURL: https://station.example.com/status
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: transit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: transit-tls
      hosts: [transit.example.com]
