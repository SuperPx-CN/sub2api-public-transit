{{- if and .Values.ingress.enabled (not .Values.ingress.hosts) }}
{{- fail "ingress.hosts is required" }}
{{- end }}
{{- $reserved := list "SERVER_HOST" "SERVER_PORT" "PUBLIC_BASE_URL" "STATION_HOME_URL" "STATION_PRICE_URL" "STATION_MONITOR_URL" "DATABASE_HOST" "DATABASE_PORT" "DATABASE_USER" "DATABASE_DBNAME" "DATABASE_SSLMODE" "DATABASE_PASSWORD" }}
{{- $seen := dict }}
{{- range .Values.extraEnv }}
{{- if or (has .name $reserved) (hasKey $seen .name) }}
{{- fail (printf "extraEnv cannot override or duplicate %s" .name) }}
{{- end }}
{{- $_ := set $seen .name true }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sub2api.fullname" . }}
  labels:
    {{- include "sub2api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sub2api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sub2api.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: transit
          image: {{ include "sub2api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "sub2api.fullname" . }}
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalDatabase.existingSecret is required" .Values.externalDatabase.existingSecret | quote }}
                  key: {{ .Values.externalDatabase.passwordKey | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
              {{- with .subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
